sonar.projectKey=pi-observational-memory-boosted
sonar.projectName=pi-observational-memory-boosted
sonar.host.url=http://127.0.0.1:6417

# Exclusive-exceptions model (pipeline/prompts/setup.md): scan the whole repo,
# exclude what must never be scanned, so a new source directory is picked up
# without a per-addition edit. Kept in step with ./nocka.exclude (temp/) and
# .gitignore (node_modules, coverage, dist/build, .scannerwork).
sonar.sources=.

# Never scanned: dependencies, build/generated output, test coverage reports,
# VCS/scan working dirs, and the pipeline scratch space listed in nocka.exclude.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.scannerwork/**,**/.git/**,**/*.d.ts,**/*.map,temp/**

# Files no test can or should cover:
# - agent/observer/prompt.ts, agent/consolidator/prompt.ts — pure system-prompt
#   prose: data handed to the spawned worker, not executable code under test.
#   (Their tool/effects siblings — agent/*/tools.ts — stay inside the floor.)
# - agent/index.ts, agent/cost.ts — worker-side extension glue that runs inside
#   a spawned headless `pi` subprocess, not under vitest (mirrors Nocka's
#   exclusion of pi extension-registration glue).
# Deliberately NOT excluded: src/debug-log.ts (0% today but has real rotation
# logic a test can reach — a coverage gap, not an exemption), src/spawn/launch.ts
# and src/ui/status-controller.ts (low today, genuinely testable).
sonar.coverage.exclusions=agent/observer/prompt.ts,agent/consolidator/prompt.ts,agent/index.ts,agent/cost.ts

sonar.sourceEncoding=UTF-8

# One report per component that runs vitest with coverage; this repo is a
# single js-ts component.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
